name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please fill out the sections below to help us reproduce and fix it.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to reproduce the behavior.
      placeholder: |
        1. Set up a query with ...
        2. Call mutation ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true

  - type: dropdown
    id: package
    attributes:
      label: Package
      description: Which package is affected?
      options:
        - "@reactivebase/server"
        - "@reactivebase/client"
        - "@reactivebase/react"
        - "@reactivebase/nextjs"
        - "@reactivebase/vue"
        - "@reactivebase/svelte"
        - "@reactivebase/cli"
        - "@reactivebase/edge"
        - "@reactivebase/graphql"
        - "@reactivebase/react-native"
        - "@reactivebase/testing"
        - "@reactivebase/migrate-from-prisma"
        - "reactivebase-vscode"
        - "create-reactivebase"
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: ReactiveBase Version
      placeholder: "0.1.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS
        - Linux
        - Windows
        - Other
    validations:
      required: false

  - type: input
    id: node-version
    attributes:
      label: Node.js Version
      placeholder: "20.x"
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Logs, screenshots, or any other relevant information.
    validations:
      required: false
