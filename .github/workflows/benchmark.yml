name: Benchmark

on:
  pull_request:
    branches: [main]
    paths:
      - "packages/server/**"
      - "packages/client/**"
  push:
    branches: [main]
    paths:
      - "packages/server/**"
      - "packages/client/**"
  workflow_dispatch:
    inputs:
      subscription_levels:
        description: "Subscription levels (comma-separated)"
        default: "1000,5000,10000"
      enable_chaos:
        description: "Enable chaos tests"
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

jobs:
  benchmark:
    name: Performance Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run benchmarks
        id: bench
        run: |
          cd packages/server
          node -e "
          const { StressTestSuite } = require('./dist/index.cjs');
          (async () => {
            const levels = '${LEVELS}'.split(',').map(Number);
            const suite = new StressTestSuite({
              subscriptionLevels: levels,
              writesPerSecond: 100,
              phaseDurationMs: 5000,
              tableCount: 10,
              enableChaos: ${CHAOS},
            });
            const report = await suite.run();
            const markdown = suite.formatReport(report);
            const json = suite.formatReportJSON(report);

            require('fs').writeFileSync('/tmp/benchmark-report.md', markdown);
            require('fs').writeFileSync('/tmp/benchmark-report.json', json);

            // Set outputs
            const summary = report.summary;
            console.log('::set-output name=passed::' + report.passed);
            console.log('::set-output name=max_subs::' + summary.maxSubscriptions);
            console.log('::set-output name=max_invalidations::' + summary.maxInvalidationsPerSecond);
            console.log('::set-output name=p99_latency::' + summary.overallP99LatencyMs);
            console.log('::set-output name=peak_memory::' + summary.peakMemoryMb);

            if (!report.passed) {
              console.error('Benchmark FAILED:');
              report.failures.forEach(f => console.error('  -', f));
              process.exit(1);
            }
          })();
          "
        env:
          LEVELS: ${{ inputs.subscription_levels || '1000,5000,10000' }}
          CHAOS: ${{ inputs.enable_chaos || 'true' }}

      - name: Check performance regression thresholds
        if: github.event_name == 'pull_request'
        run: |
          node -e "
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('/tmp/benchmark-report.json', 'utf8'));
          const s = report.summary;
          const failures = [];

          // Absolute thresholds — fail if any metric exceeds these limits
          const thresholds = {
            p99LatencyMs: { max: 50, label: 'p99 latency' },
            peakMemoryMb: { max: 512, label: 'Peak memory' },
            minSubscriptions: { min: 1000, label: 'Minimum subscriptions supported' },
            minInvalidationsPerSec: { min: 500, label: 'Minimum invalidations/sec' },
          };

          if (s.overallP99LatencyMs > thresholds.p99LatencyMs.max) {
            failures.push('p99 latency ' + s.overallP99LatencyMs + 'ms exceeds threshold of ' + thresholds.p99LatencyMs.max + 'ms');
          }
          if (s.peakMemoryMb > thresholds.peakMemoryMb.max) {
            failures.push('Peak memory ' + s.peakMemoryMb + 'MB exceeds threshold of ' + thresholds.peakMemoryMb.max + 'MB');
          }
          if (s.maxSubscriptions < thresholds.minSubscriptions.min) {
            failures.push('Max subscriptions ' + s.maxSubscriptions + ' below minimum of ' + thresholds.minSubscriptions.min);
          }
          if (s.maxInvalidationsPerSecond < thresholds.minInvalidationsPerSec.min) {
            failures.push('Max invalidations/sec ' + s.maxInvalidationsPerSecond + ' below minimum of ' + thresholds.minInvalidationsPerSec.min);
          }

          if (failures.length > 0) {
            console.error('::error::Performance regression detected:');
            failures.forEach(f => console.error('  ❌ ' + f));
            process.exit(1);
          } else {
            console.log('✅ All performance thresholds passed');
            console.log('  p99 latency: ' + s.overallP99LatencyMs + 'ms (max: ' + thresholds.p99LatencyMs.max + 'ms)');
            console.log('  Peak memory: ' + s.peakMemoryMb + 'MB (max: ' + thresholds.peakMemoryMb.max + 'MB)');
            console.log('  Subscriptions: ' + s.maxSubscriptions + ' (min: ' + thresholds.minSubscriptions.min + ')');
            console.log('  Invalidations/sec: ' + s.maxInvalidationsPerSecond + ' (min: ' + thresholds.minInvalidationsPerSec.min + ')');
          }
          "

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('/tmp/benchmark-report.md', 'utf8');
            const body = `## 📊 Benchmark Results\n\n${report}\n\n<sub>Generated by CI benchmark pipeline</sub>`;

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes('📊 Benchmark Results'));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-report
          path: |
            /tmp/benchmark-report.md
            /tmp/benchmark-report.json
          retention-days: 90

      - name: Store benchmark results for tracking
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          node -e "
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('/tmp/benchmark-report.json', 'utf8'));
          const s = report.summary;
          // Convert to github-action-benchmark customSmallerIsBetter format
          const benchmarks = [
            { name: 'p99 Latency (ms)', unit: 'ms', value: s.overallP99LatencyMs },
            { name: 'Peak Memory (MB)', unit: 'MB', value: s.peakMemoryMb },
            { name: 'Max Subscriptions', unit: 'subscriptions', value: -s.maxSubscriptions },
            { name: 'Max Invalidations/sec', unit: 'ops/sec', value: -s.maxInvalidationsPerSecond },
          ];
          fs.writeFileSync('/tmp/benchmark-tracking.json', JSON.stringify(benchmarks, null, 2));
          "

      - name: Track benchmark trend
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: ReactiveBase Performance
          tool: customSmallerIsBetter
          output-file-path: /tmp/benchmark-tracking.json
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          auto-push: true
          alert-threshold: "150%"
          comment-on-alert: true
          fail-on-alert: true

      - name: Update README benchmarks (main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          if [ -f /tmp/benchmark-report.md ]; then
            node -e "
            const fs = require('fs');
            const readme = fs.readFileSync('README.md', 'utf8');
            const report = JSON.parse(fs.readFileSync('/tmp/benchmark-report.json', 'utf8'));
            const s = report.summary;

            const badge = '| Metric | Value |\\n|--------|-------|\\n' +
              '| Peak subscriptions | ' + s.maxSubscriptions.toLocaleString() + ' |\\n' +
              '| Invalidations/sec | ' + s.maxInvalidationsPerSecond.toLocaleString() + ' |\\n' +
              '| p99 latency | ' + s.overallP99LatencyMs + 'ms |\\n' +
              '| Peak memory | ' + s.peakMemoryMb + 'MB |\\n' +
              '| Chaos tests | ' + s.chaosTestsPassed + '/' + s.chaosTestsTotal + ' passed |';

            const marker = '<!-- BENCHMARK_START -->';
            const endMarker = '<!-- BENCHMARK_END -->';
            if (readme.includes(marker)) {
              const updated = readme.replace(
                new RegExp(marker + '[\\\\s\\\\S]*?' + endMarker),
                marker + '\\n\\n### Latest Benchmark Results\\n\\n' + badge + '\\n\\n' + endMarker
              );
              fs.writeFileSync('README.md', updated);
            }
            "

            if git diff --quiet README.md; then
              echo "No benchmark changes to commit"
            else
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git add README.md
              git commit -m "docs: update benchmark results [skip ci]"
              git push
            fi
          fi
