name: PR Review
on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review-checks:
    name: Automated Review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        continue-on-error: false

      - name: Run tests
        run: npm run test

      - name: Check exports
        run: |
          node -e "
          const fs = require('fs');
          const index = fs.readFileSync('packages/server/src/index.ts', 'utf8');
          const lines = index.split('\\n').filter(l => l.trim());
          console.log('Server package exports: ' + lines.length + ' lines');
          if (lines.length < 100) {
            console.error('Warning: server index.ts has fewer exports than expected');
          }
          "

      - name: Comment PR status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ job.status }}' === 'success' ? '✅' : '❌';
            const body = `${status} **Automated Review**: Build and tests ${'${{ job.status }}'}\n\nChecklist:\n- [x] TypeScript compiles\n- [x] All tests pass\n- [x] Exports verified`;

            // Find existing comment to update instead of creating duplicates
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes('**Automated Review**'));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
