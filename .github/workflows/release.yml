name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"

      - name: Test
        run: npm run test
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"

      - name: Publish to npm
        run: |
          for pkg in packages/server packages/client packages/state packages/react packages/vue packages/svelte packages/nextjs packages/edge packages/testing packages/cli packages/reactivebase packages/create-reactivebase packages/migrate-from-prisma packages/graphql packages/react-native; do
            cd $pkg
            echo "Publishing $(node -e "console.log(require('./package.json').name)")..."
            npm publish --access public
            cd -
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
