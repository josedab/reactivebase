apiVersion: v2
name: reactivebase
description: ReactiveBase — Reactive backend framework for Postgres
type: application
version: 0.1.0
appVersion: "0.1.0"
keywords:
  - reactivebase
  - reactive
  - postgres
  - realtime
  - backend
home: https://reactivebase.dev
sources:
  - https://github.com/reactivebase/reactivebase
maintainers:
  - name: ReactiveBase
    email: team@reactivebase.dev
dependencies:
  - name: postgresql
    version: "~16.0"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: redis
    version: "~19.0"
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
