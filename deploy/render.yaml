services:
  - type: web
    name: reactivebase
    runtime: docker
    dockerfilePath: deploy/Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: reactivebase-db
          property: connectionString
      - key: PORT
        value: 4000
    healthCheckPath: /
    plan: starter

databases:
  - name: reactivebase-db
    databaseName: reactivebase
    plan: starter
    postgresMajorVersion: 16
    ipAllowList: []
