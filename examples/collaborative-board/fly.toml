# Collaborative Board Demo — Fly.io

app = "reactivebase-demo"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "4000"
  NODE_ENV = "production"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 2000
    soft_limit = 1500

# Attach Postgres:
#   fly postgres create --name reactivebase-demo-db --region iad
#   fly postgres attach reactivebase-demo-db
